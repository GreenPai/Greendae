logging:
    level:
        org:
            hibernate:
                orm:
                    jdbc:
                        bind: trace
        root: info
mybatis:
    mapper-locations: classpath:mappers/**/*.xml
server:
    port: 8080
    servlet:
        context-path: /
spring:
    profiles:
      active: local
    servlet:
        multipart:
            location: uploads
            max-file-size: 10MB

    mail:
        host: smtp.gmail.com
        port: 587
        username: ${MAIL_USERNAME}
        password: ${MAIL_PASSWORD}
        properties:
            mail:
                smtp:
                    auth: true
                    timeout: 5000
                    starttls:
                        enable: true
    application:
        name: greendae
        version: 1.0.0-RELEASE
    datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        password: fdsa33143!@
        url: jdbc:mysql://127.0.0.1:3306/greendae
        username: root
    devtools:
        livereload:
            enabled: true
    jpa:
        database: mysql
        hibernate:
            ddl-auto: update
            naming:
                physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        properties:
            hibernate:
                format_sql: true
                show_sql: false
    thymeleaf:
        prefix: classpath:/templates
